<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Record Map - Potensic Flight Log Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #map-container {
            height: 80vh;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container mt-3">
        <nav class="mb-3">
            <a href="{{ url_for('index') }}" class="btn btn-outline-primary">← Back to Upload</a>
        </nav>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Flight Record Visualization</h5>
                <div id="map-container">
                    {% if map %}
                        {{ map | safe }}
                    {% else %}
                        <div class="alert alert-warning">No flight data available to display.</div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
