<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potensic Flight Log Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Potensic Flight Log Viewer</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-warning">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Upload Flight Record</h5>
                <form action="{{ url_for('view_map') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Select ZIP file containing flight records</label>
                        <input type="file" class="form-control" id="file" name="file" accept=".zip" required>
                        <div class="form-text" id="fileHelp">Please select a ZIP file containing your flight records.</div>
                        <div class="mt-2" id="selectedFile" style="display: none;">
                            <span class="text-success">Selected file: <span id="fileName"></span></span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">Upload and View Flight Data</button>
                </form>
                <script>
                    document.getElementById('file').addEventListener('change', function(e) {
                        const fileName = e.target.files[0]?.name;
                        const selectedFileDiv = document.getElementById('selectedFile');
                        const fileNameSpan = document.getElementById('fileName');
                        
                        if (fileName) {
                            fileNameSpan.textContent = fileName;
                            selectedFileDiv.style.display = 'block';
                        } else {
                            selectedFileDiv.style.display = 'none';
                        }
                    });
                </script>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
